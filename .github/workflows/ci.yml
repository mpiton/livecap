name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang 21 and glib headers (required by libwebrtc)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libglib2.0-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Download livekit-server for the end-to-end tests (pinned, checksum verified)
        env:
          LIVEKIT_VERSION: 1.13.11
          LIVEKIT_SHA256: 1e9ee90ca301e1842b2887fc77cb122759756a9c8aeb4334ee91de3325ec43fb
        run: |
          dir="$RUNNER_TEMP/livekit"
          archive="livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$archive" "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}/$archive"
          echo "${LIVEKIT_SHA256}  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" livekit-server
          echo "LIVEKIT_SERVER_BIN=$dir/livekit-server" >> "$GITHUB_ENV"
      # Unit tests, the Azure clients against the fake Azure Speech and Translator, and the agent
      # against those fakes and livekit-server --dev. On CI a missing LIVEKIT_SERVER_BIN fails the
      # tests. The canary against the real Azure (tests/canary.rs) is ignored and never runs here.
      - run: cargo test --locked

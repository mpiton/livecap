[package]
name = "livecap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Live translated captions for LiveKit calls: a hidden Rust agent that streams each speaker to a speech-to-text service and publishes captions back to the room."
license = "MIT"
keywords = ["livekit", "captions", "speech-to-text", "translation", "webrtc"]
categories = ["multimedia::audio", "web-programming"]
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures = "0.3.34"
livekit = { version = "0.9.5", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.9.0", default-features = false, features = ["access-token", "webhooks"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
